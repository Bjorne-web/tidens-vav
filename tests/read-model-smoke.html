<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tidens väv – läsmodell smoke test</title><style>body{font:16px system-ui;max-width:900px;margin:24px auto;padding:0 16px}iframe{width:100%;height:220px;border:1px solid #aaa}td,th{padding:9px;border-bottom:1px solid #ccd}table{border-collapse:collapse;width:100%;text-align:left}.ok{color:green}.fail{color:crimson}</style></head><body><h1>Funktionstest – forskningsläsmodell</h1><p>Denna testvy öppnar samma app som PR-preview, läser befintliga datakällor och visar diagnostik. Inga data skrivs över. Testet körs endast när denna testsida öppnas.</p><iframe title="Tidens väv (test)" src="../index.html"></iframe><p id="state">Väntar på appen ...</p><p><button id="checkSearch" type="button">Testa sökning efter D001 och Tobit</button> <strong id="searchStatus">Ej körd</strong></p><p><button id="checkReader" type="button">Testa att öppna D001/Tobit i läsaren</button> <strong id="readerStatus">Ej körd</strong></p><table><thead><tr><th>ID</th><th>Hittad</th><th>Typ</th><th>Sammanfattning</th><th>Källor</th><th>Tidstyp</th></tr></thead><tbody id="results"></tbody></table><script>const iframe=document.querySelector('iframe');iframe.addEventListener('load',()=>{const w=iframe.contentWindow;const m=w.TidensResearchReadModel;if(!m){document.querySelector('#state').textContent='FEL: forskningsmodell saknas';return;}const ids=['H005','H045','B001','D001','AP001','AP002','AP003','AP004','AP005','AP006','O067'];const d=m.diagnose(ids);document.querySelector('#state').textContent='Läsmodell: '+m.version+' · Testade poster: '+ids.length;const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));document.querySelector('#results').innerHTML=d.map(x=>'<tr><td>'+esc(x.id)+'</td><td class="'+(x.found?'ok':'fail')+'">'+(x.found?'Ja':'Nej')+'</td><td>'+esc(x.subtype)+'</td><td>'+String(x.hasSummary)+'</td><td>'+String(x.hasSources)+'</td><td>'+String(x.hasDateType)+'</td></tr>').join('');});document.getElementById('checkSearch').addEventListener('click',()=>{try{const w=iframe.contentWindow,input=w.document.getElementById('search'),panel=w.document.getElementById('v827SearchResults'),status=document.getElementById('searchStatus');if(!input||!panel){status.textContent='FEL: sökkomponent saknas';return;}const original=input.value;input.value='D001';input.dispatchEvent(new w.Event('input',{bubbles:true}));const match=panel.textContent.includes('Tobit')&&!panel.textContent.includes('Inga matchande poster');status.textContent=match?'GODKÄNT: D001 ger träff för Tobit':'FEL: D001 gav inte Tobit som sökträff';input.value=original;input.dispatchEvent(new w.Event('input',{bubbles:true}));}catch(e){document.getElementById('searchStatus').textContent='FEL: '+e.message;}});document.getElementById('checkReader').addEventListener('click',()=>{const status=document.getElementById('readerStatus');try{const w=iframe.contentWindow,doc=w.document,input=doc.getElementById('search'),panel=doc.getElementById('v827SearchResults');if(!input||!panel){status.textContent='FEL: sökfält eller resultatpanel saknas';return;}input.value='D001';input.dispatchEvent(new w.Event('input',{bubbles:true}));const buttons=[...panel.querySelectorAll('[data-v827-result]')];const match=buttons.find(b=>b.textContent.includes('Tobit'));if(!match){status.textContent='FEL: Tobit saknas i sökresultatet';return;}match.click();const detail=doc.getElementById('detail');const visibleText=detail?.innerText||'';const titleFound=/\bTobit\b/.test(visibleText);const idFound=/forskningspost\s+D001\b/i.test(visibleText)||/\bD001\s*[·–-]\s*Tobit\b/i.test(visibleText);if(titleFound&&idFound){status.textContent='GODKÄNT: bokläsaren visar forskningspost D001 – Tobit';}else{status.textContent='FEL: läsaren visar inte både D001 och Tobit';}}catch(e){status.textContent='FEL: '+e.message;}});</script></body></html>
