name: B2 category source audit
on:
  pull_request:
    paths:
      - 'tests/category-source-audit.cjs'
      - 'data/**'
      - '.github/workflows/b2-category-source-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit stable IDs and research enrichments
        run: node tests/category-source-audit.cjs
