name: B2.3 apocrypha book classification
on:
  pull_request:
    paths:
      - 'v915-category-read-model.js'
      - 'tests/b2-apocrypha-book-classification.test.cjs'
      - '.github/workflows/b2-3-apocrypha.yml'
  workflow_dispatch:
jobs:
  apocrypha-classification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b2-apocrypha-book-classification.test.cjs
      - run: node tests/b2-bible-book-classification.test.cjs
      - run: node tests/category-read-model.test.cjs
      - run: node tests/category-coverage.test.cjs
