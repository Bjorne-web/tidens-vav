name: V8.58 book reader and thematic links
on:
  push:
    branches:
      - 'v8.*'
  pull_request:
jobs:
  book-reader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-v858.mjs
