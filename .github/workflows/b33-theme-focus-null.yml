name: B3.3 theme focus null guard
on:
  pull_request:
    paths:
      - 'v912-cross-view-themes-compare.js'
      - 'tests/b33-theme-focus-null.test.cjs'
      - '.github/workflows/b33-theme-focus-null.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b33-theme-focus-null.test.cjs
      - run: node tests/b33-cross-view-selection.test.cjs
