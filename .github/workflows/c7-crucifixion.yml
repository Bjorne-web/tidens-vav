name: C7 Crucifixion historical dating and calendar alternatives
on:
  pull_request:
  push:
    branches: [main]
jobs:
  crucifixion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-crucifixion-o126.mjs
