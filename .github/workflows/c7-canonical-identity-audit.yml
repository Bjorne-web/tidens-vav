name: C7 canonical identity audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  canonical-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/audit-canonical-identity-c7.mjs
