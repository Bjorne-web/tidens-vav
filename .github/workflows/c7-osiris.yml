name: C7 Osiris early text witness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  osiris:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-osiris-o075.mjs
