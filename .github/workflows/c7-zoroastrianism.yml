name: C7 Zoroastrianism textual witness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  zoroastrianism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-zoroastrianism-o087.mjs
