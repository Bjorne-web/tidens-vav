name: C7 Jerusalem destruction and Jewish revolt chronology
on:
  pull_request:
  push:
    branches: [main]
jobs:
  jerusalem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-jerusalem-o129.mjs
