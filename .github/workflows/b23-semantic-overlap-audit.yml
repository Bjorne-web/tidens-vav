name: B2.3 repeated-title semantic review
on:
  pull_request:
    paths:
      - 'tests/b23-semantic-overlap-audit.test.cjs'
      - '.github/workflows/b23-semantic-overlap-audit.yml'
      - 'data/data.generated.js'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b23-semantic-overlap-audit.test.cjs
      - run: node tests/b23-ho-full-audit.test.cjs
      - run: node tests/category-coverage.test.cjs
