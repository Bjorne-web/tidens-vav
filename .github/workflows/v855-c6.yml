name: V8.55 C6 scientific review check
on:
  push:
    branches:
      - 'v8.*'
  pull_request:
jobs:
  c6-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-v855.mjs
