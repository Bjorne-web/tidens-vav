name: B2.3 read-only category pilot
on:
  pull_request:
    paths:
      - 'v915-category-read-model.js'
      - 'tests/category-read-model.test.cjs'
      - '.github/workflows/b2-3-category-read-model.yml'
  workflow_dispatch:
jobs:
  model:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/category-read-model.test.cjs
