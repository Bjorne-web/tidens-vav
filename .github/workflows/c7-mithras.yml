  pull_request:
  push:
    branches: [main]
jobs:
  mithras:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-mithras-o078.mjs
