name: C7 Nan Madol archaeology
on:
  pull_request:
  push:
    branches: [main]
jobs:
  nan-madol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-nanmadol-o064.mjs
