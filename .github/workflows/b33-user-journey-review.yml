name: B3.3 user journey context regression
on:
  pull_request:
    paths:
      - 'previews/b33-isolated-view-preview.html'
      - 'docs/b33-user-journey-review.md'
      - 'tests/b33-user-journey-review.test.cjs'
      - '.github/workflows/b33-user-journey-review.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b33-user-journey-review.test.cjs
      - run: node tests/b33-interactions-mobile.test.cjs
      - run: node tests/b33-isolated-ui-preview.test.cjs
