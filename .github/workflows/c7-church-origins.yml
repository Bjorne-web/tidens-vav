name: C7 church origins chronological boundaries
on:
  pull_request:
  push:
    branches: [main]
jobs:
  church-origins:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-church-origins-o127.mjs
