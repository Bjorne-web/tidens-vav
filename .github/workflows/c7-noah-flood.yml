name: C7 Noah Gilgamesh flood source audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  noah:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-noah-flood-o097.mjs
