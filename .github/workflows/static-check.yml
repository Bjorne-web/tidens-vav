name: Tidens väv – statiska kontroller
on:
  push:
    branches:
      - main
      - 'v8.*'
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify data, review ledger and JavaScript
        run: |
          node tests/smoke-v834.mjs
          node tests/smoke-v835.mjs
          node tests/smoke-v836.mjs
          node tests/smoke-c6-progress.mjs
          node tests/smoke-v837.mjs
          node tests/smoke-v838.mjs
          node tests/smoke-reader-layout-v838.mjs
          node tests/smoke-v839.mjs
          node tests/smoke-reader-universal-v839.mjs
          node tests/smoke-v840.mjs
          node tests/smoke-v841.mjs
