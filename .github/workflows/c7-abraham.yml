name: C7 Abraham canonical identity and source audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  abraham:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-abraham-o099.mjs
