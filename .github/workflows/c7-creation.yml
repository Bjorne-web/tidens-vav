name: C7 Genesis creation identity and source audit
on:
  pull_request:
  push:
    branches: [main]
jobs:
  creation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-creation-o095.mjs
