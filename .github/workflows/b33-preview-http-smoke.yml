name: B3.3 complete site HTTP smoke
on:
  pull_request:
    paths:
      - 'tests/b33-site-http-smoke.test.cjs'
      - '.github/workflows/b33-preview-http-smoke.yml'
      - 'docs/b33-http-smoke.md'
  workflow_dispatch:
jobs:
  http-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b33-preview-assets.test.cjs
      - run: node tests/b33-site-http-smoke.test.cjs
