name: C7 return and second temple source chronology
on:
  pull_request:
  push:
    branches: [main]
jobs:
  return-temple:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-return-temple-o117.mjs
