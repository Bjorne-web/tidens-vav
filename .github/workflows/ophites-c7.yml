name: C7 publiceringsgrind – Ophiterna och Nag Hammadi
on:
  pull_request:
    paths:
      - 'data/c7-religionshistorisk-betydelse.v890.js'
      - 'tests/browser-ophites-c7.cjs'
      - 'tests/browser-c7-links-v899.cjs'
      - 'v899-c7-reader-links.js'
      - 'v899-c7-reader-links.css'
      - 'v887-home-areas.js'
      - 'v887-home-areas.css'
      - 'v892-topic-navigation.js'
      - 'v892-topic-navigation.css'
      - 'v900-timeline-landscape.js'
      - 'v900-timeline-landscape.css'
      - 'tests/smoke-v900-timeline-landscape.mjs'
      - 'tests/browser-v899-topic-icons.cjs'
      - 'data/c7-religionshistorisk-betydelse.v8101.js'
      - 'tests/browser-c7-v8101.cjs'
      - 'tests/smoke-c7-v8101.mjs'
      - 'v858-book-reader.js'
      - 'v839-reader-unified.js'
      - 'v838-reader-reflow.js'
      - 'index.html'
      - 'tests/smoke-c7.mjs'
      - 'tests/new-post-religion-gate.mjs'
      - '.github/workflows/ophites-c7.yml'
  workflow_dispatch:
jobs:
  reader-render:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7.mjs
      - run: node tests/new-post-religion-gate.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-ophites-c7.cjs
      - run: node tests/browser-c7-links-v899.cjs
      - run: node tests/browser-v899-topic-icons.cjs
      - run: node tests/browser-c7-v8101.cjs
