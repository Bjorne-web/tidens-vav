name: B2 H series consolidated audit
on:
  pull_request:
    paths:
      - 'tests/b2-h-series-audit.test.cjs'
      - '.github/workflows/b2-h-series-audit.yml'
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b2-h-series-audit.test.cjs
      - run: node tests/category-coverage.test.cjs
      - run: node tests/category-read-model.test.cjs
