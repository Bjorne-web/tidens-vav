name: C7 Herakles twelve labours archaeological witness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  herakles-labours:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-herakles-labours-o086.mjs
