name: C7 retrospective wars second group
on:
  pull_request:
  push:
    branches: [main]
jobs:
  war-dating-second-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-retro-wars-next.mjs
