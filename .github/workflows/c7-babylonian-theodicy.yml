name: C7 Babylonian Theodicy Job witness
on:
  pull_request:
  push:
    branches: [main]
jobs:
  theodicy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-babylonian-theodicy-o091.mjs
