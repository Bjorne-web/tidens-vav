name: C7 Genesis Babel canonical identity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  babel-genesis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smoke-c7-babel-genesis-o098.mjs
