name: B2.3 classification coverage
on:
  pull_request:
    paths:
      - 'tests/category-coverage.test.cjs'
      - 'v915-category-read-model.js'
      - 'data/**'
      - '.github/workflows/b2-3-coverage.yml'
  workflow_dispatch:
jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/category-coverage.test.cjs
