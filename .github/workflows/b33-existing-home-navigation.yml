name: B3.3 existing home navigation guard
on:
  pull_request:
    paths:
      - 'v914-home-paths-c3.js'
      - 'tests/b33-existing-home-navigation.test.cjs'
      - 'docs/b33-existing-home-navigation-guard.md'
      - '.github/workflows/b33-existing-home-navigation.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b33-existing-home-navigation.test.cjs
