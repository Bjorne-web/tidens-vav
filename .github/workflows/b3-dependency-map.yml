name: B3 dependency mapping and design gates
on:
  pull_request:
    paths:
      - 'docs/b3-dependency-map.md'
      - 'tests/b3-dependency-map.test.cjs'
      - '.github/workflows/b3-dependency-map.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/b3-dependency-map.test.cjs
      - run: node tests/b3-design-integration-readiness.test.cjs
      - run: node tests/b23-ho-full-audit.test.cjs
