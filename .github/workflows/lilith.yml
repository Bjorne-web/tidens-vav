name: C7 – obligatorisk religionshistorisk betydelse
on:
  pull_request:
    paths:
      - 'data/**'
      - 'tests/**'
      - 'index.html'
      - '.github/workflows/lilith.yml'
  workflow_dispatch:
jobs:
  significance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/post-religion-gate.mjs
      - run: node tests/smoke-lilith.mjs
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser-lilith.cjs
