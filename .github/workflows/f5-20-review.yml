name: F5.20 consolidated F5 review package
on:
  pull_request:
    paths:
      - 'tests/f5-20-*'
      - '.github/workflows/f5-20-review.yml'
  workflow_dispatch:
jobs:
  review-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate standalone reviewer site and smoke in Chromium
        run: bash tests/f5-20-review.sh
      - name: Upload review package (not public deployment)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: f5-20-manual-review-site
          path: out/f5-20/site/
          retention-days: 14
      - name: Upload desktop and mobile screenshots / smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: f5-20-review-smoke-evidence
          path: |
            out/f5-20/*.png
            out/f5-20/*-dom.html
          if-no-files-found: warn
          retention-days: 14
